[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragscope"
version = "0.1.0"
description = "Human-reviewed ground truth for RAG evaluation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ragscope = "ragscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
